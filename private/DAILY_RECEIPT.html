<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>日记发票</title>

<style>
:root{--radius:16px}

body{
  margin:0;
  font-family:-apple-system,"PingFang SC",sans-serif;
  background:#f5f5f5;
}

/* 容器 */
.container{
  max-width:560px;
  margin:auto;
  padding:16px 14px 90px;
}

/* 标题 */
h1{
  text-align:center;
  font-size:18px;
  letter-spacing:2px;
}

/* 输入卡片 */
.field{
  background:#fff;
  border-radius:var(--radius);
  padding:12px;
  margin-bottom:10px;
  box-shadow:0 4px 14px rgba(0,0,0,.05);
}

/* label */
.label{
  font-size:12px;
  color:#888;
  margin-bottom:6px;
}

/* 输入 */
input,textarea{
  width:100%;
  border:none;
  outline:none;
  font-size:15px;
  background:transparent;
}

textarea{
  min-height:70px;
  resize:none;
}

/* 上传区域 */
.upload{
  border:1px dashed #ddd;
  border-radius:12px;
  padding:14px;
  text-align:center;
  cursor:pointer;
  position:relative;
}

.upload img{
  width:100%;
  max-height:140px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
  display:none;
}

/* 开关 */
.switch{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.toggle{
  width:44px;height:24px;
  background:#ddd;
  border-radius:20px;
  position:relative;
}

.toggle::after{
  content:"";
  width:20px;height:20px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:2px;left:2px;
  transition:.3s;
}

input:checked + .toggle{
  background:#111;
}
input:checked + .toggle::after{
  left:22px;
}

/* 底部按钮 */
.footer{
  position:fixed;
  bottom:0;left:0;right:0;
  padding:10px 14px;
  background:#fff;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-size:16px;
}

/* 弹窗 */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content{
  width:90%;
  max-width:520px;
}

/* 卡片 */
.card{
  border-radius:16px;
  overflow:hidden;
  font-family:"Courier New", monospace;
  letter-spacing:0.5px;
}

/* 顶图 */
.cover-wrapper{
  position:relative;
  height:120px;
  overflow:hidden;
}

.cover-img{
  position:absolute;
  width:100%;
  top:0;
  left:0;
  cursor:grab;
}

/* 模糊 */
.overlay{
  position:absolute;
  inset:0;
  backdrop-filter:blur(8px);
}

/* 渐变 */
.fade{
  position:absolute;
  bottom:0;
  height:60px;
  width:100%;
  background:linear-gradient(to bottom,transparent,var(--bg-color));
}

/* 撕边 */
.receipt-edge{
  height:12px;
  background:
    radial-gradient(circle at 6px 6px,#fff 6px,transparent 6px) repeat-x;
  background-size:12px 12px;
}

/* 内容 */
.content{
  padding:16px;
  border-top:1px dashed rgba(0,0,0,.2);
}

.line{
  border-bottom:1px dashed rgba(0,0,0,.2);
  padding:8px 0;
  font-size:14px;
  white-space:pre-wrap;
}

/* 按钮组 */
.actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}
.actions button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
}
.primary{background:#111;color:#fff}
.ghost{background:#eee}
</style>
</head>

<body>

<div class="container">
  <h1>DAILY RECEIPT</h1>

  <div class="field">
    <div class="label">日期</div>
    <input id="date" type="date">
  </div>

  <div class="field">
    <div class="label">图片</div>
    <div class="upload">
      <span id="uploadText">点击上传图片</span>
      <img id="preview">
      <input id="image" type="file" accept="image/*" style="position:absolute;inset:0;opacity:0">
    </div>
  </div>

  <div class="field switch">
    <span>顶图模糊</span>
    <label>
      <input type="checkbox" id="blurToggle" hidden checked>
      <div class="toggle"></div>
    </label>
  </div>

  <div class="field"><textarea id="timeline" placeholder="今日事件"></textarea></div>
  <div class="field"><textarea id="account" placeholder="书账"></textarea></div>
  <div class="field"><textarea id="food" placeholder="食物"></textarea></div>
  <div class="field"><textarea id="newthings" placeholder="新事物"></textarea></div>
  <div class="field"><textarea id="notes" placeholder="碎片"></textarea></div>
</div>

<div class="footer">
  <button class="btn" onclick="generateCard()">生成日记发票</button>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div id="card" class="card"></div>
    <div class="actions">
      <button class="primary" onclick="downloadCard()">下载</button>
      <button class="ghost" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>
let uploadedImage=null;
let offsetY=0,isDragging=false,startY=0;

/* 取主色 */
function getColor(img){
  const c=document.createElement('canvas');
  const ctx=c.getContext('2d');
  c.width=img.width;c.height=img.height;
  ctx.drawImage(img,0,0);
  const d=ctx.getImageData(0,0,c.width,c.height).data;
  let r=0,g=0,b=0,cnt=0;
  for(let i=0;i<d.length;i+=40){
    r+=d[i];g+=d[i+1];b+=d[i+2];cnt++;
  }
  return {r:r/cnt,g:g/cnt,b:b/cnt};
}

/* 深色判断 */
function isDark({r,g,b}){
  return (0.299*r+0.587*g+0.114*b)<140;
}

/* 上传 */
image.onchange=e=>{
  const f=e.target.files[0];
  if(!f) return;

  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const color=getColor(img);
      uploadedImage={
        src:ev.target.result,
        css:`rgb(${color.r|0},${color.g|0},${color.b|0})`,
        dark:isDark(color)
      };

      preview.src=ev.target.result;
      preview.style.display='block';
      uploadText.style.display='none';
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(f);
};

/* 拖拽 */
function initDrag(){
  const img=document.querySelector('.cover-img');
  const wrap=document.querySelector('.cover-wrapper');
  if(!img||!wrap) return;

  wrap.onmousedown=e=>{
    isDragging=true;
    startY=e.clientY;
  };

  window.onmouseup=()=>isDragging=false;

  window.onmousemove=e=>{
    if(!isDragging) return;
    offsetY+=e.clientY-startY;
    startY=e.clientY;

    offsetY=Math.min(0,Math.max(offsetY,-80));
    img.style.top=offsetY+'px';
  };
}

/* 生成 */
function generateCard(){
  const card=document.getElementById('card');
  const modal=document.getElementById('modal');

  let bg='#fff',color='#111';
  if(uploadedImage){
    bg=uploadedImage.css;
    color=uploadedImage.dark?'#fff':'#111';
  }

  card.style.background=bg;
  card.style.color=color;
  card.style.setProperty('--bg-color',bg);

  card.innerHTML=`
    ${uploadedImage?`
    <div class="cover-wrapper">
      <img src="${uploadedImage.src}" class="cover-img">
      ${blurToggle.checked?'<div class="overlay"></div>':''}
      <div class="fade"></div>
    </div>`:''}
    <div class="receipt-edge"></div>
    <div class="content">
      <div class="line">🧾 ${date.value}</div>
      <div class="line">${timeline.value}</div>
      <div class="line">${account.value}</div>
      <div class="line">${food.value}</div>
      <div class="line">${newthings.value}</div>
      <div class="line">${notes.value}</div>
    </div>
  `;

  modal.style.display='flex';
  initDrag();
}

/* 关闭 */
function closeModal(){
  modal.style.display='none';
}

/* 下载 */
function downloadCard(){
  html2canvas(card,{scale:2}).then(canvas=>{
    const a=document.createElement('a');
    a.download='日记发票.png';
    a.href=canvas.toDataURL();
    a.click();
  });
}
</script>

</body>
</html>
